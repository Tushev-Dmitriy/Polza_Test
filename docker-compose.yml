services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PGDATA: /var/lib/postgresql/data
    ports:
      - "3000:3000"
    volumes:
      - company_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/companies').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    restart: unless-stopped

volumes:
  company_data:
