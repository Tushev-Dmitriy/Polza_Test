services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polza
      POSTGRES_USER: polza
      POSTGRES_PASSWORD: polza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polza -d polza"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

